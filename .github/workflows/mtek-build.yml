name: MTEK tested library rebuild

on:
  push:
    branches: [mtekllc-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-dispatch:
    if: github.repository == 'mtekllc/ulfius'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config check gnutls-bin \
            libmicrohttpd-dev libgnutls28-dev libjansson-dev libcurl4-gnutls-dev \
            zlib1g-dev liborcania-dev libyder-dev
      - name: Build pinned companion libraries
        run: |
          set -euo pipefail
          for item in orcania:f3d9fa89ac9ae78c3162ce249aefc1df4df889d4 yder:8b446e2cfba46567bf3a265f0373ab30e32f7b9d; do
            name=${item%%:*}
            revision=${item#*:}
            git clone "https://github.com/babelouest/$name.git" "$RUNNER_TEMP/$name"
            git -C "$RUNNER_TEMP/$name" checkout --detach "$revision"
            cmake -S "$RUNNER_TEMP/$name" -B "$RUNNER_TEMP/$name-build" \
              -DCMAKE_PREFIX_PATH=/usr/local -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DCMAKE_INSTALL_LIBDIR=lib -DWITH_JOURNALD=OFF
            cmake --build "$RUNNER_TEMP/$name-build" --parallel "$(nproc)"
            sudo cmake --install "$RUNNER_TEMP/$name-build"
          done
          sudo ldconfig
      - name: Build and test
        run: |
          make -C src -j"$(nproc)"
          LD_LIBRARY_PATH=/usr/local/lib make -C test VERBOSE=1 test
      - name: Trigger base image rebuild
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${GH_PAT:?configure GH_PAT with dispatch access to mtekresearchllc/auto-docker-base}"
          payload=$(jq -n --arg sha "$SOURCE_SHA" \
            '{event_type:"mtek-library-updated",client_payload:{library:"ulfius",source_sha:$sha,ulfius_sha:$sha}}')
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mtekresearchllc/auto-docker-base/dispatches \
            -d "$payload"
